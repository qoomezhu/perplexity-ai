name: Deploy to Hugging Face Space

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      space_name:
        description: "Hugging Face Space name"
        required: false
        default: ""

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_USERNAME: ${{ secrets.HF_USERNAME || 'qoomezhu' }}
      HF_SPACE_NAME: ${{ github.event.inputs.space_name || secrets.HF_SPACE || 'ppl' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate secrets
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${HF_TOKEN:-}" ]; then
            echo "::error::Missing required secret: HF_TOKEN"
            exit 1
          fi
          if [ -z "${HF_USERNAME:-}" ]; then
            echo "::error::Missing required value: HF_USERNAME"
            exit 1
          fi
          if [ -z "${HF_SPACE_NAME:-}" ]; then
            echo "::error::Missing required value: HF_SPACE_NAME"
            exit 1
          fi
          echo "HF deploy target: ${HF_USERNAME}/${HF_SPACE_NAME}"

      - name: Install tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y rsync

      - name: Verify HF repo access
        shell: bash
        run: |
          set -euo pipefail
          git ls-remote "https://${HF_USERNAME}:${HF_TOKEN}@huggingface.co/spaces/${HF_USERNAME}/${HF_SPACE_NAME}" >/dev/null

      - name: Clone Hugging Face Space repo
        shell: bash
        run: |
          set -euo pipefail
          rm -rf hf-space
          git clone "https://${HF_USERNAME}:${HF_TOKEN}@huggingface.co/spaces/${HF_USERNAME}/${HF_SPACE_NAME}" hf-space

      - name: Sync files to Space
        shell: bash
        run: |
          set -euo pipefail
          rsync -av --delete \
            --exclude 'hf-space/' \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '.venv/' \
            --exclude '__pycache__/' \
            --exclude '*.pyc' \
            ./ hf-space/

          # Force HF-specific Dockerfile
          cp Dockerfile.hf hf-space/Dockerfile

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          cd hf-space
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .

          if git diff --cached --quiet; then
            echo "No changes to deploy"
            exit 0
          fi

          git commit -m "chore: sync from github ${GITHUB_SHA::7}"
          git push origin main
