name: Deploy to Hugging Face Space

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      space_name:
        description: "Hugging Face Space name"
        required: false
        default: "ppl"

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_USERNAME: ${{ secrets.HF_USERNAME || 'qoomezhu' }}
      HF_SPACE_NAME: ${{ github.event.inputs.space_name || 'ppl' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate secrets
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::Missing required secret: HF_TOKEN"
            exit 1
          fi

      - name: Clone Hugging Face Space repo
        run: |
          git clone "https://${HF_USERNAME}:${HF_TOKEN}@huggingface.co/spaces/${HF_USERNAME}/${HF_SPACE_NAME}" hf-space

      - name: Sync files to Space
        run: |
          rsync -av --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '.venv/' \
            --exclude '__pycache__/' \
            --exclude '*.pyc' \
            ./ hf-space/

          # Force HF-specific Dockerfile
          cp Dockerfile.hf hf-space/Dockerfile

      - name: Commit and push
        run: |
          cd hf-space
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .

          if git diff --cached --quiet; then
            echo "No changes to deploy"
            exit 0
          fi

          git commit -m "chore: sync from github ${GITHUB_SHA::7}"
          git push origin main
