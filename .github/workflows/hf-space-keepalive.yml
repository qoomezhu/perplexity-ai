name: Keep HF Space Alive

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      HF_USERNAME: ${{ secrets.HF_USERNAME || 'qoomezhu' }}
      HF_SPACE_NAME: ${{ secrets.HF_SPACE || 'ppl' }}
    steps:
      - name: Ping health endpoint
        run: |
          URL="https://${HF_USERNAME}-${HF_SPACE_NAME}.hf.space/health"
          echo "Pinging ${URL}"
          for i in 1 2 3; do
            if curl -fsS --max-time 20 "$URL" > /dev/null; then
              echo "Ping success: $URL"
              exit 0
            fi
            echo "Attempt $i failed, retrying..."
            sleep 10
          done
          echo "All retries failed"
          exit 1
