name: Keep HF Space Alive

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          URL="https://qoomezhu-ppl.hf.space/health"
          for i in 1 2 3; do
            if curl -fsS --max-time 20 "$URL" > /dev/null; then
              echo "Ping success: $URL"
              exit 0
            fi
            echo "Attempt $i failed, retrying..."
            sleep 10
          done
          echo "All retries failed"
          exit 1
